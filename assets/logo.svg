<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Enterprise Construções">
  <!-- shortcut: logo provisória em texto; trocar pelo arquivo oficial da Enterprise quando existir (mesma proporção 3:2) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a33"/>
      <stop offset="1" stop-color="#080d1b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e3b4"/>
      <stop offset=".5" stop-color="#e7c375"/>
      <stop offset="1" stop-color="#b8862b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- prédios subindo -->
  <g fill="url(#gold)">
    <rect x="246" y="118" width="30" height="62"/>
    <rect x="285" y="82" width="30" height="98"/>
    <rect x="324" y="100" width="30" height="80"/>
    <rect x="232" y="186" width="136" height="5"/>
  </g>
  <g fill="#0b1225">
    <rect x="253" y="128" width="6" height="8"/><rect x="263" y="128" width="6" height="8"/>
    <rect x="253" y="146" width="6" height="8"/><rect x="263" y="146" width="6" height="8"/>
    <rect x="292" y="94" width="6" height="8"/><rect x="302" y="94" width="6" height="8"/>
    <rect x="292" y="112" width="6" height="8"/><rect x="302" y="112" width="6" height="8"/>
    <rect x="292" y="130" width="6" height="8"/><rect x="302" y="130" width="6" height="8"/>
    <rect x="331" y="110" width="6" height="8"/><rect x="341" y="110" width="6" height="8"/>
    <rect x="331" y="128" width="6" height="8"/><rect x="341" y="128" width="6" height="8"/>
  </g>
  <text x="300" y="268" text-anchor="middle" textLength="470" lengthAdjust="spacingAndGlyphs"
        font-family="Sora, 'Segoe UI', Arial, sans-serif" font-size="70" font-weight="700" fill="url(#gold)">ENTERPRISE</text>
  <rect x="170" y="288" width="260" height="2" fill="#d9b45b" opacity=".7"/>
  <text x="300" y="330" text-anchor="middle" textLength="300" lengthAdjust="spacingAndGlyphs"
        font-family="Sora, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="400" fill="#e7c375">CONSTRUÇÕES</text>
</svg>
